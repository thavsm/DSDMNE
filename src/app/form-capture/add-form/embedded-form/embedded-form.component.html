<div style="margin-left: 0%;">
    <button mat-icon-button color="warn" (click)="closePopup()">
        <mat-icon>close</mat-icon>
    </button>
</div>
<div class="card-body p-2">
    <div class="row">
        <div class="col">
            <!-- <mat-button-toggle value="createForm" style="background-color: whitesmoke;font-weight: 500;width: 134px;color: black;"
            (click)="createForm()">Add Beneficiary</mat-button-toggle> -->
            <!-- <button mat-button value="createForm" [disabled]="hideButton" class="btn btn-sm btn-primary"
            (click)="createForm()">Add Beneficiary</button> -->
            <div class="button-overlay" [hidden]="!hideButton" (click)="showDisabledButtonAlert()"></div>
<button mat-button value="createForm" [disabled]="hideButton" class="btn btn-sm btn-primary"
        (click)="createForm()">Add Beneficiary</button>
            <hr>
            <kendo-grid [kendoGridBinding]="gridView" [pageSize]="pageSize" [pageable]="true" [height]="320" [filterable]="true"
            [sortable]="true" [resizable]="true"  (pageChange)="onPageChange($event)">
  
            <kendo-grid-column field="dateSent" title="Date Sent" [width]="10">
            </kendo-grid-column>
  
            <kendo-grid-column field="timeSent" title="Time Sent" [width]="10">
            </kendo-grid-column>

            <kendo-grid-column field="displayableOne" title="{{DisplayOne}}" [width]="10">
            </kendo-grid-column>
  
            <kendo-grid-column field="displayableTwo" title="{{DisplayTwo}}" [width]="10">
            </kendo-grid-column>
  
            <kendo-grid-column field="geography" title="Location" [width]="15">
            </kendo-grid-column>
  
            <kendo-grid-column field="sentBy" title="Sent By" [width]="15">
            </kendo-grid-column>

            <kendo-grid-column field="errorCode" title="Error Code" [width]="18">
            </kendo-grid-column>

            <kendo-grid-column field="isProcessed" title="Processed" [width]="10">
            </kendo-grid-column>
        <kendo-grid-column  [width]="6">
                <ng-template kendoGridCellTemplate let-dataItem>
                  <mat-button-toggle value="editFrom" mat-icon-button (click)="editForm(dataItem)">
                    <mat-icon matTooltip="Update" style="color:#bf7c00;">edit</mat-icon>
                  </mat-button-toggle>
                </ng-template>
              </kendo-grid-column>
              <kendo-grid-column  [width]="6">
                <ng-template kendoGridCellTemplate let-dataItem>
                  <mat-button-toggle value="deleteForm" mat-icon-button (click)="clickDelete(dataItem)"  >
                    <mat-icon matTooltip="Delete" style="color: red;">delete</mat-icon>
                  </mat-button-toggle>
                </ng-template>
              </kendo-grid-column> 
            <ng-template kendoPagerTemplate let-totalPages="totalPages" let-currentPage="currentPage">
              <kendo-pager-prev-buttons></kendo-pager-prev-buttons>             
              <kendo-pager-numeric-buttons [buttonCount]="10"></kendo-pager-numeric-buttons>
              <kendo-pager-next-buttons></kendo-pager-next-buttons>
              <kendo-pager-page-sizes [pageSizes]="pageSizes"></kendo-pager-page-sizes>
              <kendo-pager-info></kendo-pager-info>
              Current page: {{currentPage}}
           </ng-template>
          </kendo-grid>
        </div>
    </div>
</div>
